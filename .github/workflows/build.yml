name: Build APK

# Todo push compila um APK de teste (aba Actions).
# Push no branch principal, com a chave de assinatura configurada, também publica uma release.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      IS_MAIN: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk carga-bateria.apk

      - uses: actions/upload-artifact@v4
        with:
          name: carga-bateria
          path: carga-bateria.apk

      # Sem a chave definitiva, publica como pré-release (assinatura provisória):
      # não vira "latest" e quem instalar precisará desinstalar ao pegar uma versão definitiva.
      - name: Publish release
        if: env.IS_MAIN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Carga Bateria 1.0.${{ github.run_number }}${{ env.KEYSTORE_FILE == '' && ' (assinatura provisória)' || '' }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.KEYSTORE_FILE == '' }}
          make_latest: ${{ env.KEYSTORE_FILE != '' }}
          files: carga-bateria.apk
