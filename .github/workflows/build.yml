name: Build APK

# Todo push compila um APK (aba Actions). Push no branch principal também publica uma release.
on:
  push:
    paths-ignore: ['.github/workflows/cleanup.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk carga-bateria.apk

      - uses: actions/upload-artifact@v4
        with:
          name: carga-bateria
          path: carga-bateria.apk

      - name: Publish release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Carga Bateria 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: carga-bateria.apk
