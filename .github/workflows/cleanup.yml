name: Cleanup old releases

on:
  push:
    paths: ['.github/workflows/cleanup.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          for t in build-1 build-2 build-6; do
            gh release delete "$t" --cleanup-tag --yes || echo "skip $t"
          done
