plugins {
    id 'com.android.application'
}

// No CI, o número do build vem do GitHub Actions; localmente fica 0.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()

android {
    namespace 'com.ranieri.cargabateria'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ranieri.cargabateria'
        minSdk 21
        targetSdk 34
        versionCode Math.max(buildNumber, 1)
        versionName "1.0.${buildNumber}"
        resValue 'string', 'app_version', "v1.0.${buildNumber}"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Assinado com a chave de debug do build (descartável): sem secrets para gerenciar.
            // Consequência: para atualizar, é preciso desinstalar a versão anterior.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
