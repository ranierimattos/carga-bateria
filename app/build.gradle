plugins {
    id 'com.android.application'
}

// No CI, o número do build vem do GitHub Actions; localmente fica 0.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()
// Assinatura de release: vem dos secrets do repositório (ver README). Sem eles, usa a chave de debug.
def keystoreFile = System.getenv('KEYSTORE_FILE')
if (keystoreFile) {
    ['KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD'].each {
        if (!System.getenv(it)) throw new GradleException("Secret $it não configurado")
    }
}

android {
    namespace 'com.ranieri.cargabateria'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ranieri.cargabateria'
        minSdk 21
        targetSdk 34
        versionCode Math.max(buildNumber, 1)
        versionName "1.0.${buildNumber}"
        resValue 'string', 'app_version', "v1.0.${buildNumber}"
    }

    signingConfigs {
        release {
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig keystoreFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
